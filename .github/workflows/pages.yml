name: Publish HTML to GitHub Pages

on:
  push:
    branches:
      - pages-site
    paths:
      - 'html/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/pages-site'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload HTML
        uses: actions/upload-pages-artifact@v4
        with:
          path: html
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
