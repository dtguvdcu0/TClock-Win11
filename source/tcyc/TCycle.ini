[TCycle]
Enabled=1
PollSec=1
GraceSec=60
LogLevel=1
LogFile=tcycle.log
StateFile=tcycle.state.ini

[Debug]
ForceCmdlineReadFail=0

[Integration]
UseTClockIniGate=1
TClockIniPath=tclock-win11.ini
