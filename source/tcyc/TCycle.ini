[Task.1]
Enabled=0
Name=SampleInterval
TriggerType=interval
IntervalSec=1800
ActionPath=notepad.exe
ActionArgs=
ActionCwd=
SingleInstance=1
WatchdogEnabled=0
WatchdogRetrySec=10
WatchdogMaxRetry=-1
WatchdogRequireArgsMatch=1
